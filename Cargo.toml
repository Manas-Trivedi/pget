[package]
name = "pget"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
colored = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true